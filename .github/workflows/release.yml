name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/gate.yml
  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Package exact tagged source
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py pack --tag "$RELEASE_TAG"
          python3 scripts/release.py verify --tag "$RELEASE_TAG"
          python3 - <<'PY'
          import json, os
          version = json.load(open('package.json'))['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'archive=hermes-context-overview-{version}.tar.gz\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/plugin.js
            dist/release-notes.md
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Publish verified named assets without clobbering existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_SHA"
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file release-notes.md --latest \
            "hermes-context-overview-${VERSION}.tar.gz" plugin.js release-notes.md SHA256SUMS
