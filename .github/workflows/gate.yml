name: Portable release gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  gate:
    name: Node ${{ matrix.node }} gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      PLAYWRIGHT_BROWSERS_PATH: node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate release tag before exercising source
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py check --tag "$RELEASE_TAG"
      - run: pnpm gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-context-evidence-node-${{ matrix.node }}
          path: |
            .local/browser/screenshots/*.png
            .local/browser-console.json
            .local/browser-visual-checks.json
          retention-days: 14
          if-no-files-found: warn
